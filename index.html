<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algo de Rosas y Amor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #2c0b14 0%, #120408 100%);
            color: #fce4ec;
            font-family: 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(30, 8, 14, 0.75);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(229, 57, 53, 0.3);
            border: 1px solid rgba(233, 30, 99, 0.3);
            max-width: 500px;
            width: 90%;
            backdrop-filter: blur(5px);
        }

        .rose-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
            transition: transform 0.5s ease;
        }

        .rose-container.active {
            transform: scale(1.1);
            filter: drop-shadow(0 0 15px rgba(255, 64, 129, 0.8));
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #ff80ab;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .poem-box {
            font-style: italic;
            font-size: 1.1rem;
            line-height: 1.6;
            min-height: 80px;
            margin-bottom: 25px;
            color: #f8bbd0;
            transition: opacity 0.5s ease;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            background: linear-gradient(135deg, #c2185b, #e91e63);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
            transition: all 0.3s ease;
            font-family: 'Georgia', serif;
        }

        button:hover {
            background: linear-gradient(135deg, #d81b60, #f06292);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 30, 99, 0.6);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Canvas para la lluvia de pétalos -->
    <canvas id="petalsCanvas"></canvas>

    <div class="container">
        <!-- Rosa SVG Interactiva -->
        <div class="rose-container" id="roseIcon">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <path d="M50 90 C 50 70, 30 50, 30 35 C 30 20, 45 15, 50 30 C 55 15, 70 20, 70 35 C 70 50, 50 70, 50 90 Z" fill="#c2185b" />
                <path d="M50 85 C 45 65, 65 45, 60 30 C 55 20, 48 25, 50 35 C 52 25, 45 20, 40 30 C 35 45, 55 65, 50 85 Z" fill="#e91e63" />
                <path d="M50 40 C 42 35, 40 45, 50 50 C 60 45, 58 35, 50 40 Z" fill="#ff80ab" />
                <path d="M48 70 Q 40 65, 35 70 Q 45 80, 48 70 Z" fill="#4caf50" />
                <path d="M52 70 Q 60 65, 65 70 Q 55 80, 52 70 Z" fill="#4caf50" />
            </svg>
        </div>

        <h1>Algo de Rosas y Amor</h1>
        
        <div class="poem-box" id="poemText">
            Haz clic en reproducir para escuchar la melodía y descubrir un verso...
        </div>

        <div class="btn-group">
            <button id="playBtn">✨ Reproducer Melodía</button>
            <button id="nextBtn">🌹 Otro Verso</button>
        </div>
    </div>

    <script>
        // --- 1. LLUVIA DE PÉTALOS (CANVAS) ---
        const canvas = document.getElementById('petalsCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const petals = [];
        const numPetals = 35;

        class Petal {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.size = Math.random() * 8 + 6;
                this.speedY = Math.random() * 1.5 + 0.8;
                this.speedX = Math.random() * 1 - 0.5;
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 0.02 - 0.01;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.color = Math.random() > 0.5 ? '#e91e63' : '#ff4081';
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y * 0.02) * 0.5;
                this.angle += this.spin;
                if (this.y > canvas.height + 20) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < numPetals; i++) {
            petals.push(new Petal());
            petals[i].y = Math.random() * canvas.height; // Distribuidos al inicio
        }

        function animatePetals() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animatePetals);
        }
        animatePetals();

        // --- 2. VERSOS POÉTICOS ---
        const poemas = [
            "Entre pétalos de carmesí y susurros de calma, cada latido encuentra su refugio constante.",
            "Hay rosas que florecen sin prisa, recordando que la paciencia es la forma más pura de cuidar.",
            "Ser el norte y la quietud cuando el mundo entero decide hacer ruido.",
            "Un jardín secreto sembrado de pequeños momentos, miradas y certezas.",
            "El tiempo se detiene suavemente cuando el alma descansa en buena compañía."
        ];

        let currentPoemIndex = 0;
        const poemTextEl = document.getElementById('poemText');
        const nextBtn = document.getElementById('nextBtn');

        nextBtn.addEventListener('click', () => {
            poemTextEl.style.opacity = 0;
            setTimeout(() => {
                currentPoemIndex = (currentPoemIndex + 1) % poemas.length;
                poemTextEl.textContent = poemas[currentPoemIndex];
                poemTextEl.style.opacity = 1;
            }, 300);
        });

        // --- 3. AUDIO SINTÉTICO (WEB AUDIO API) ---
        const playBtn = document.getElementById('playBtn');
        const roseIcon = document.getElementById('roseIcon');
        let audioCtx = null;

        function playMelody() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            roseIcon.classList.add('active');
            setTimeout(() => roseIcon.classList.remove('active'), 2500);

            // Notas relajantes estilo caja de música (Frecuencias en Hz)
            const notes = [329.63, 392.00, 440.00, 493.88, 587.33, 659.25];
            const now = audioCtx.currentTime;

            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + index * 0.4);

                // Envolvente suave (Fade in / Fade out)
                gain.gain.setValueAtTime(0, now + index * 0.4);
                gain.gain.linearRampToValueAtTime(0.15, now + index * 0.4 + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.4 + 1.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now + index * 0.4);
                osc.stop(now + index * 0.4 + 1.5);
            });

            // Cambiar de verso automáticamente al reproducir
            nextBtn.click();
        }

        playBtn.addEventListener('click', playMelody);
    </script>
</body>
</html>
